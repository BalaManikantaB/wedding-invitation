[build]
  publish = "."
  # No build command - pure static site

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Assets are replaced in place (music.mp3, gate.webp, og-social.jpg have all
    # been swapped at the same URL), so `immutable` would strand returning
    # visitors on stale files for a year. Fresh for 1h, then served from cache
    # while revalidating in the background — fast repeats, updates propagate.
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.{css,js}"
  [headers.values]
    # Served with ?v= query versioning in index.html, so long cache is safe
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
